name: Steps Examples

on:
  workflow_dispatch:

jobs:
  steps-example:
    runs-on: ubuntu-latest
    steps:
      - name: Create testmachine directory
        run: mkdir testmachine

      - name: Run uname and save output
        run: uname -a > testmachine/output.txt

      - name: Verify output.txt contents
        run: cat testmachine/output.txt

      - name: List directories and contents
        run: ls -alhR
