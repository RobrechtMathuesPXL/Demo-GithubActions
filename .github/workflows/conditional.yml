name: Conditional 

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Kies tussen: development/staging/production"
        required: true
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  Conditional:
    runs-on: ubuntu-latest

    steps:
      - name: production-step
        if: ${{ github.event.inputs.environment == 'production' }}
        run: echo "Deploying to production!"

      - name: development/staging-step
        if: ${{ github.event.inputs.environment == 'development' || github.event.inputs.environment == 'staging' }}
        run: echo "Running in test mode"

      - name: altijd_uitgevoerd_environment-step
        if: always()
        run: echo "Selected environment: ${{ github.event.inputs.environment }}"
